# Nginx Production Configuration for Archon-TRAXIS
# Optimized for production workloads with load balancing, caching, and security

user nginx;
worker_processes auto;
worker_rlimit_nofile 8192;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # === BASIC SETTINGS ===
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # === GZIP COMPRESSION ===
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # === SECURITY HEADERS ===
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # === UPSTREAM SERVICES ===

    # Backend API Load Balancing
    upstream archon_api {
        least_conn;
        server archon-server:8181 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # MCP Service
    upstream archon_mcp {
        server archon-mcp:8051 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # Frontend Service
    upstream archon_frontend {
        server archon-frontend:3737 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # === RATE LIMITING ===
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=5r/s;

    # === CACHING ===
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m
                     max_size=100m inactive=60m use_temp_path=off;

    # === SERVER BLOCKS ===

    # Health Check Endpoint
    server {
        listen 80;
        server_name health.internal;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # Main Application Server
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Security
        server_tokens off;

        # === FRONTEND (React App) ===
        location / {
            proxy_pass http://archon_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Static Asset Caching
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                proxy_pass http://archon_frontend;
                proxy_cache static_cache;
                proxy_cache_valid 200 1h;
                proxy_cache_use_stale error timeout invalid_header updating;
                add_header X-Cache-Status $upstream_cache_status;
                expires 1h;
            }

            # API Fallback Prevention
            location ~* ^/api/ {
                return 404;
            }
        }

        # === BACKEND API ===
        location /api/ {
            # Rate Limiting
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://archon_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Buffer Settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # Health Checks
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }

        # === MCP SERVICE ===
        location /mcp/ {
            limit_req zone=general_limit burst=10 nodelay;

            proxy_pass http://archon_mcp/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket Support (if needed)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # === MONITORING ENDPOINTS ===
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.20.0.0/16;  # Docker network
            deny all;
        }

        # === SECURITY ===

        # Block access to sensitive files
        location ~* \.(env|log|conf)$ {
            deny all;
            return 404;
        }

        # Block hidden files
        location ~ /\. {
            deny all;
            return 404;
        }

        # Default error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # === HTTPS SERVER (Optional) ===
    # Uncomment and configure SSL certificates for production HTTPS

    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/ssl/certs/archon.crt;
    #     ssl_certificate_key /etc/ssl/certs/archon.key;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #
    #     # HSTS
    #     add_header Strict-Transport-Security "max-age=63072000" always;
    #
    #     # Include same location blocks as HTTP server
    #     include /etc/nginx/conf.d/locations.conf;
    # }

    # Redirect HTTP to HTTPS (when SSL is enabled)
    # server {
    #     listen 80;
    #     server_name your-domain.com;
    #     return 301 https://$server_name$request_uri;
    # }
}